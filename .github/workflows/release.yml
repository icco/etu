name: Release
on:
  schedule:
    # Run daily at midnight UTC
    - cron: 0 0 * * *
  workflow_dispatch: # Allows manual triggering
  push:
    # Pushing a tag by hand releases exactly that version, skipping the
    # semantic-version bump. This does not double-release on the cron path
    # only because checkout below passes no `token:`, so the tag is pushed
    # with GITHUB_TOKEN, and GITHUB_TOKEN pushes do not trigger workflows.
    # Giving checkout a PAT would break that and cause a second release.
    tags:
      - v*
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for semantic versioning
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Determine next version
        id: versioning
        if: github.event_name != 'push'
        uses: PaulHatch/semantic-version@v6.0.3
        with:
          tag_prefix: v
          # Patterns must be wrapped in / / to be treated as regexes. A bare string is
          # a literal substring match, so 'feat:' misses scoped commits like 'feat(x):'.
          major_pattern: '/^[a-z]+(\(.+\))?!:/'
          minor_pattern: '/feat(\(.+\))?:/'
          version_format: ${major}.${minor}.${patch}
      - name: Create and push tag
        if: github.event_name != 'push' && steps.versioning.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"
        env:
          VERSION_TAG: ${{ steps.versioning.outputs.version_tag }}
      - name: Run GoReleaser
        # On a tag push GoReleaser reads the version from the tag itself.
        if: github.event_name == 'push' || steps.versioning.outputs.changed == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          # Use GITHUB_TOKEN for releases in the same repo
          # For homebrew tap, use a PAT if available, otherwise fall back to GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
